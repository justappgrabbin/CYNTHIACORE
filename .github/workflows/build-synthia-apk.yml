name: Build Synthia v0.2.1 APK
on:
  workflow_dispatch:
  push:
    branches: [fusion-originals-apk-2026-10-20]
    paths:
      - 'android/Synthia-v0.2.1-Android-Source.zip'
      - '.github/workflows/build-synthia-apk.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack Synthia Android project
        run: |
          mkdir -p build-synthia
          unzip -q android/Synthia-v0.2.1-Android-Source.zip -d build-synthia
      - name: Build debug APK
        working-directory: build-synthia
        run: gradle --no-daemon assembleDebug
      - name: Verify built APK
        run: test -s build-synthia/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-v0.2.1-debug-APK
          path: build-synthia/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
